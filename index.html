<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Controle de Cheques</title>
<style>
  :root {
    --bg: #eef7f2;
    --brand-green: #0aa816;
    --brand-blue: #1189bd;
    --card: #ffffff;
    --border: #d7e8e0;
    --text: #1f2328;
    --text-muted: #5b6b72;
    --accent: #1189bd;
    --accent-hover: #0d6f99;
    --danger: #dc2626;
    --danger-bg: #fee2e2;
    --success-bg: #dcfce7;
    --success-text: #166534;
    --pending-bg: #fef3c7;
    --pending-text: #92400e;
    --returned-bg: #fee2e2;
    --returned-text: #991b1b;
    --cancelled-bg: #e5e7eb;
    --cancelled-text: #374151;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(160deg, #e3f6e8 0%, #e4f2fa 55%, #e3f6e8 100%);
    background-attachment: fixed;
    color: var(--text);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 900px; margin: 0 auto; }
  h1 {
    font-size: 22px;
    font-weight: 700;
    margin: 0 0 4px;
    background: linear-gradient(90deg, var(--brand-green), var(--brand-blue));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    display: inline-block;
  }
  .subtitle { color: var(--text-muted); font-size: 14px; margin: 0 0 24px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 20px;
    box-shadow: 0 2px 10px rgba(17,137,189,0.06);
  }
  .card h2 { font-size: 15px; font-weight: 600; margin: 0 0 16px; }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr auto;
    gap: 12px;
    align-items: end;
  }
  @media (max-width: 640px) {
    .form-grid { grid-template-columns: 1fr; }
  }
  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
  }
  input[type=text], select {
    width: 100%;
    height: 38px;
    padding: 0 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
  }
  input[type=text]:focus, select:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
  }
  button {
    height: 38px;
    padding: 0 18px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, var(--brand-green), var(--brand-blue));
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: filter 0.15s;
  }
  button:hover { filter: brightness(0.92); }
  button.secondary {
    background: #fff;
    color: var(--text);
    border: 1px solid var(--border);
  }
  button.secondary:hover { background: #f3f4f6; }
  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .toolbar input, .toolbar select { width: auto; min-width: 160px; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    text-align: left;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    color: var(--text-muted);
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
  }
  td {
    padding: 10px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
  }
  tr:last-child td { border-bottom: none; }
  .badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-pendente { background: var(--pending-bg); color: var(--pending-text); }
  .badge-compensado { background: var(--success-bg); color: var(--success-text); }
  .badge-devolvido { background: var(--returned-bg); color: var(--returned-text); }
  .badge-cancelado { background: var(--cancelled-bg); color: var(--cancelled-text); }
  .row-actions { display: flex; gap: 8px; }
  .icon-btn { height: 30px; padding: 0 10px; font-size: 12px; font-weight: 500; }
  .icon-btn.delete { color: var(--danger); border-color: var(--danger-bg); }
  .icon-btn.delete:hover { background: var(--danger-bg); }
  .empty { text-align: center; color: var(--text-muted); padding: 40px 20px; font-size: 14px; }
  .status-msg { font-size: 13px; color: var(--text-muted); margin-top: 8px; min-height: 18px; }
  .count-tag { font-size: 13px; color: var(--text-muted); margin-left: auto; }
  .conn-dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #d1d5db; margin-right: 6px;
  }
  .conn-dot.on { background: var(--brand-green); }
  .conn-status { font-size: 12px; color: var(--text-muted); display: flex; align-items: center; margin-bottom: 16px; }
  .form-grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 12px;
  }
  @media (max-width: 640px) {
    .form-grid-2 { grid-template-columns: 1fr; }
  }
  input[type=file] {
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 13px;
    background: #fff;
    color: var(--text-muted);
  }
  .thumb {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    object-fit: cover;
    cursor: pointer;
    border: 1px solid var(--border);
    display: block;
  }
  .no-thumb {
    width: 40px;
    height: 40px;
    border-radius: 6px;
    border: 1px dashed var(--border);
    color: var(--text-muted);
    font-size: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .modal-overlay.open { display: flex; }
  .modal-box {
    background: #fff;
    border-radius: var(--radius);
    padding: 16px;
    max-width: 90vw;
    max-height: 90vh;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .modal-box img { max-width: 100%; max-height: 75vh; border-radius: 8px; display: block; }
  .modal-close {
    align-self: flex-end;
  }
  .logo-header {
    display: flex;
    justify-content: center;
    background: linear-gradient(135deg, var(--brand-green), var(--brand-blue));
    border-radius: var(--radius);
    padding: 4px;
    margin-bottom: 20px;
    box-shadow: 0 4px 14px rgba(17,137,189,0.18);
  }
  .logo-header-inner {
    background: #ffffff;
    border-radius: 8px;
    padding: 6px;
    width: 100%;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }
  .logo-img {
    max-width: 100%;
    width: 100%;
    height: auto;
    display: block;
    border-radius: 4px;
  }
  .logo-stack {
    width: 100%;
  }
  .logo-tagline {
    text-align: center;
    font-size: 15px;
    letter-spacing: 0.08em;
    color: #374151;
    margin-top: 2px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
  }
</style>
</head>

          <option value="Cancelado">Cancelado</option>
        </select>
      </div>
      <div>
        <label for="numCte">Número do CTE vinculado</label>
        <input type="text" id="numCte" placeholder="Ex: CTE-4567">
      </div>
      <div>
        <button id="btnSalvar" onclick="salvarCheque()">Adicionar</button>
      </div>
    </div>
    <div class="form-grid-2">
      <div>
        <label for="emitidoPor">Emitido por</label>
        <input type="text" id="emitidoPor" placeholder="Nome de quem emitiu o cheque">
      </div>
      <div>
        <label for="fotoCheque">Foto do cheque</label>
        <input type="file" id="fotoCheque" accept="image/*">
      </div>
    </div>
    <div class="status-msg" id="msg"></div>
  </div>

  <div class="card">
    <div class="toolbar">
      <input type="text" id="busca" placeholder="Buscar por cheque ou CTE..." oninput="renderizar()">
      <select id="filtroStatus" onchange="renderizar()">
        <option value="">Todos os status</option>
        <option value="Pendente">Pendente</option>
        <option value="Compensado">Compensado</option>
        <option value="Devolvido">Devolvido</option>
        <option value="Cancelado">Cancelado</option>
      </select>
      <span class="count-tag" id="contagem"></span>
    </div>
    <div id="tabelaContainer"></div>
  </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="if(event.target===this) fecharModal()">
  <div class="modal-box">
    <button class="secondary modal-close" onclick="fecharModal()">Fechar</button>
    <img id="modalImg" src="" alt="Foto do cheque">
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-app-compat.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/firebase/10.12.2/firebase-database-compat.min.js"></script>
<script>
// ============================================================
// PASSO OBRIGATORIO: cole aqui as chaves do SEU projeto Firebase
// (siga o passo a passo que o Claude te enviou no chat)
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyDSKEaNPcfG5ueYTt9EGkfES3qubqzqkqw",
  authDomain: "cheques-pianetto.firebaseapp.com",
  databaseURL: "https://cheques-pianetto-default-rtdb.firebaseio.com",
  projectId: "cheques-pianetto",
  storageBucket: "cheques-pianetto.firebasestorage.app",
  messagingSenderId: "697183009282",
  appId: "1:697183009282:web:06b2e83c9299967547851b"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const chequesRef = db.ref('cheques');

let cheques = {};

chequesRef.on('value', snapshot => {
  cheques = snapshot.val() || {};
  document.getElementById('connDot').classList.add('on');
  document.getElementById('connText').textContent = 'Conectado — dados em tempo real';
  renderizar();
});

db.ref('.info/connected').on('value', snap => {
  if (snap.val() === false) {
    document.getElementById('connDot').classList.remove('on');
    document.getElementById('connText').textContent = 'Sem conexão';
  }
});

function badgeClass(status) {
  const map = {
    'Pendente': 'badge-pendente',
    'Compensado': 'badge-compensado',
    'Devolvido': 'badge-devolvido',
    'Cancelado': 'badge-cancelado'
  };
  return map[status] || 'badge-pendente';
}

function mostrarMsg(texto) {
  const el = document.getElementById('msg');
  el.textContent = texto;
  setTimeout(() => { if (el.textContent === texto) el.textContent = ''; }, 2500);
}

function comprimirImagem(file, maxLado = 900, qualidade = 0.6) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let { width, height } = img;
        if (width > height && width > maxLado) {
          height = Math.round(height * (maxLado / width));
          width = maxLado;
        } else if (height > maxLado) {
          width = Math.round(width * (maxLado / height));
          height = maxLado;
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', qualidade));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function salvarCheque() {
  const numCheque = document.getElementById('numCheque').value.trim();
  const status = document.getElementById('status').value;
  const numCte = document.getElementById('numCte').value.trim();
  const emitidoPor = document.getElementById('emitidoPor').value.trim();
  const arquivoFoto = document.getElementById('fotoCheque').files[0];

  if (!numCheque) {
    mostrarMsg('Informe o número do cheque.');
    return;
  }

  const btn = document.getElementById('btnSalvar');
  btn.disabled = true;
  btn.textContent = 'Salvando...';

  try {
    let foto = null;
    if (arquivoFoto) {
      foto = await comprimirImagem(arquivoFoto);
    }

    const novoId = chequesRef.push().key;
    await chequesRef.child(novoId).set({
      numCheque,
      status,
      numCte: numCte || '-',
      emitidoPor: emitidoPor || '-',
      foto: foto || null,
      criadoEm: Date.now()
    });

    document.getElementById('numCheque').value = '';
    document.getElementById('numCte').value = '';
    document.getElementById('emitidoPor').value = '';
    document.getElementById('fotoCheque').value = '';
    document.getElementById('numCheque').focus();
    mostrarMsg('Cheque adicionado.');
  } catch (err) {
    mostrarMsg('Erro ao salvar. Tente novamente com uma foto menor.');
  } finally {
    btn.disabled = false;
    btn.textContent = 'Adicionar';
  }
}

function abrirModal(src) {
  document.getElementById('modalImg').src = src;
  document.getElementById('modalOverlay').classList.add('open');
}

function fecharModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalImg').src = '';
}

function excluirCheque(id) {
  chequesRef.child(id).remove();
}

function alterarStatus(id, novoStatus) {
  chequesRef.child(id).update({ status: novoStatus });
}

function renderizar() {
  const busca = document.getElementById('busca').value.trim().toLowerCase();
  const filtroStatus = document.getElementById('filtroStatus').value;
  const container = document.getElementById('tabelaContainer');

  let lista = Object.keys(cheques).map(id => ({ id, ...cheques[id] }));
  lista.sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));

  let filtrados = lista.filter(c => {
    const passaBusca = !busca || (c.numCheque||'').toLowerCase().includes(busca) || (c.numCte||'').toLowerCase().includes(busca) || (c.emitidoPor||'').toLowerCase().includes(busca);
    const passaStatus = !filtroStatus || c.status === filtroStatus;
    return passaBusca && passaStatus;
  });

  document.getElementById('contagem').textContent = filtrados.length + ' cheque(s)';

  if (filtrados.length === 0) {
    container.innerHTML = '<div class="empty">Nenhum cheque cadastrado ainda.</div>';
    return;
  }

  let html = '<table><thead><tr><th>Nº do cheque</th><th>Status</th><th>Nº do CTE</th><th>Emitido por</th><th>Foto</th><th></th></tr></thead><tbody>';
  for (const c of filtrados) {
    const fotoCel = c.foto
      ? `<img class="thumb" src="${c.foto}" onclick="abrirModal('${c.foto}')" alt="Foto do cheque ${escapeHtml(c.numCheque)}">`
      : `<div class="no-thumb">sem foto</div>`;
    html += `<tr>
      <td>${escapeHtml(c.numCheque)}</td>
      <td>
        <select onchange="alterarStatus('${c.id}', this.value)" style="height:30px; font-size:12px; padding:0 6px; width:auto;">
          <option value="Pendente" ${c.status==='Pendente'?'selected':''}>Pendente</option>
          <option value="Compensado" ${c.status==='Compensado'?'selected':''}>Compensado</option>
          <option value="Devolvido" ${c.status==='Devolvido'?'selected':''}>Devolvido</option>
          <option value="Cancelado" ${c.status==='Cancelado'?'selected':''}>Cancelado</option>
        </select>
      </td>
      <td>${escapeHtml(c.numCte)}</td>
      <td>${escapeHtml(c.emitidoPor || '-')}</td>
      <td>${fotoCel}</td>
      <td class="row-actions">
        <button class="secondary icon-btn delete" onclick="excluirCheque('${c.id}')">Excluir</button>
      </td>
    </tr>`;
  }
  html += '</tbody></table>';
  container.innerHTML = html;
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

document.getElementById('numCheque').addEventListener('keydown', e => { if (e.key === 'Enter') salvarCheque(); });
document.getElementById('numCte').addEventListener('keydown', e => { if (e.key === 'Enter') salvarCheque(); });
</script>
</body>
</html>
